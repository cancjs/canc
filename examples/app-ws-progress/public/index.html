<!doctype html>
<html lang="en">
 <head>
 <meta charset="utf-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1" />
 <title>Video export progress</title>
 <style>
 body { font: 15px/1.5 system-ui, sans-serif; max-width: 32rem; margin: 3rem auto; padding: 0 1rem; }
 h1 { font-size: 1.2rem; }
 progress { width: 100%; height: 1.4rem; }
 .row { display: flex; gap: .5rem; margin: 1rem 0; }
 button { padding: .4rem .9rem; }
 #status { color: #555; min-height: 1.5em; }
 </style>
 </head>
 <body>
 <h1>Video export</h1>
 <p>Start an export, then cancel it or just close the tab. The server stops the transcode either way.</p>
 <progress id="bar" value="0" max="100"></progress>
 <div class="row">
 <button id="start">Start export</button>
 <button id="cancel" disabled>Cancel</button>
 </div>
 <p id="status">Idle.</p>

 <script>
 // Plain browser WebSocket. No canc code on the client: cancellation is a server concern.
 const bar = document.getElementById('bar');
 const startBtn = document.getElementById('start');
 const cancelBtn = document.getElementById('cancel');
 const status = document.getElementById('status');
 let ws = null;
 const jobId = 'export-1';

 startBtn.onclick = () => {
 ws = new WebSocket(`ws://${location.host}`);
 ws.onopen = () => {
 ws.send(JSON.stringify({ type: 'start', jobId }));
 startBtn.disabled = true;
 cancelBtn.disabled = false;
 status.textContent = 'Exporting...';
 };
 ws.onmessage = (event) => {
 const msg = JSON.parse(event.data);
 if (msg.type === 'progress') bar.value = msg.percent;
 if (msg.type === 'done') finish('Done.');
 if (msg.type === 'canceled') finish('Canceled.');
 };
 ws.onclose = () => { if (!startBtn.disabled) return; finish('Disconnected.'); };
 };

 cancelBtn.onclick = () => {
 // One of the two cancel paths. The other is simply closing the tab.
 if (ws) ws.send(JSON.stringify({ type: 'cancel', jobId }));
 };

 function finish(text) {
 status.textContent = text;
 startBtn.disabled = false;
 cancelBtn.disabled = true;
 if (ws && ws.readyState === WebSocket.OPEN) ws.close();
 ws = null;
 }
 </script>
 </body>
</html>
